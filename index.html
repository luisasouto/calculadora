<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="calculadora">
            <div class="visor">0</div>
            <div class="teclado">
                <div class="wrapper">
                    <div class="digitos">
                        <button class="numero">7</button>
                        <button class="numero">8</button>
                        <button class="numero">9</button>

                        <button class="numero">4</button>
                        <button class="numero">5</button>
                        <button class="numero">6</button>

                        <button class="numero">1</button>
                        <button class="numero">2</button>
                        <button class="numero">3</button>

                        <button class="numero zero">0</button>
                        <button class="ponto">.</button>
                    </div>
                    <div class="digitos-2">
                        <div class="operadores">
                            <button data-operador="-" class="operador">&minus;</button>
                            <button data-operador="*" class="operador">&times;</button>
                            <button data-operador="/" class="operador">&divide;</button>
                            <button data-operador="+" class="operador">&plus;</button>
                        </div>
                    </div>
                </div>
                <div class="digitos-3">
                    <button class="limpar">C</button>
                    <button class="resultado">=</button>
                </div>
            </div>
        </div>
    </div>


</body>

</html>
